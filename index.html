<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Enterprise Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="dashboard">

    <header class="dashboard-header">
      <h1>Enterprise Dashboard</h1>
      <p>Responsive mobile-first dashboard interface.</p>
    </header>

    <nav class="dashboard-nav" aria-label="Main navigation">
      <a href="#overview">Overview</a>
      <a href="#analytics">Analytics</a>
      <a href="#users">Users</a>
      <a href="#settings">Settings</a>
    </nav>

    <main>
      <section class="dashboard-grid" id="overview" aria-label="Dashboard cards">

        <article class="card">
          <h2>Active Users</h2>
          <p>1,248</p>
        </article>

        <article class="card">
          <h2>Revenue</h2>
          <p>$84,500</p>
        </article>

        <article class="card">
          <h2>Orders</h2>
          <p>3,842</p>
        </article>

        <article class="card">
          <h2>Conversion</h2>
          <p>8.6%</p>
        </article>

      </section>
    </main>

    <footer>
      <p>&copy; 2026 Enterprise Dashboard</p>
    </footer>

  </div>
</body>
</html>
